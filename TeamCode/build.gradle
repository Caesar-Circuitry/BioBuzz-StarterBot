buildscript {
    repositories {
        mavenCentral()
        google()   // needed: Load uses the Android build tools from here
        maven { url "https://repo.dairy.foundation/releases" }
    }
    dependencies {
        classpath "dev.frozenmilk:Load:0.3.2"
    }
}

apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'
apply plugin: 'dev.frozenmilk.sinister.sloth.load'   // must come AFTER the lines above

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

repositories {
    maven { url = "https://repo.dairy.foundation/releases" }
    maven { url = "https://mymaven.bylazar.com/releases" }
}

dependencies {
    implementation project(':FtcRobotController')

    // Sloth (hot reload): 0.3.2 is what Panels 1.0.19 expects
    implementation "dev.frozenmilk.sinister:Sloth:0.3.2"

    // Regular Panels (it supports Sloth now, so no more com.bylazar.sloth)
    implementation "com.bylazar:fullpanels:1.0.19"
}